name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # Check if PR is from a fork
  check-origin:
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.check.outputs.is_fork }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

  # Approve fork PRs (requires manual approval via environment)
  approve-fork:
    needs: check-origin
    if: needs.check-origin.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    environment: ci-fork-approval
    steps:
      - run: echo "Fork PR approved for CI"

  # Run CI
  build:
    needs: [check-origin, approve-fork]
    if: always() && (needs.check-origin.outputs.is_fork == 'false' || needs.approve-fork.result == 'success')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
